apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scalelab-api
  namespace: scalelab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scalelab-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      # A short local-demo window prevents immediate flapping without making
      # every scale-down experiment wait for the five-minute default.
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
