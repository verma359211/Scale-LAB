apiVersion: v1
kind: Service
metadata:
  name: scalelab-web
  namespace: scalelab
spec:
  type: LoadBalancer
  selector:
    app: scalelab-web
  ports:
    - name: http
      port: 5174
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalelab-web
  namespace: scalelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scalelab-web
  template:
    metadata:
      labels:
        app: scalelab-web
    spec:
      containers:
        - name: web
          image: scalelab-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
