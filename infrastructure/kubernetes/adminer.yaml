apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: scalelab
spec:
  # Docker Desktop publishes this local development service on localhost:8081.
  # It is intentionally not routed through the application Ingress.
  type: LoadBalancer
  selector:
    app: adminer
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: scalelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          image: adminer:6.1.1-standalone
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: postgres
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
