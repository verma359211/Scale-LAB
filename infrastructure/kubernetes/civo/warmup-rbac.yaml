apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-controller
  namespace: scalelab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warmup-recovery
  namespace: scalelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scalelab-warmup-hpa
  namespace: scalelab
rules:
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    resourceNames: [scalelab-api]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scalelab-warmup-hpa
  namespace: scalelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scalelab-warmup-hpa
subjects:
  - kind: ServiceAccount
    name: lab-controller
    namespace: scalelab
  - kind: ServiceAccount
    name: warmup-recovery
    namespace: scalelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scalelab-warmup-readiness
  namespace: scalelab
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [scalelab-api]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scalelab-warmup-readiness
  namespace: scalelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scalelab-warmup-readiness
subjects:
  - kind: ServiceAccount
    name: lab-controller
    namespace: scalelab
