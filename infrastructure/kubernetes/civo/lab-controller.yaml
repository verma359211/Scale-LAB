apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-controller-config
  namespace: scalelab
data:
  PORT: "4000"
  PROMETHEUS_URL: http://prometheus:9090
  LOADGEN_CONTROLLER_URL: http://192.168.1.8:4100
  BENCHMARK_RESET_URL: http://scalelab-api:3001/internal/benchmark/reset
  UPSTREAM_TIMEOUT_MS: "5000"
  PUBLIC_CONTROLS_ENABLED: "true"
  PUBLIC_ORIGIN: https://scalelab.chandanverma.space
  KUBERNETES_WARMUP_ENABLED: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: lab-controller
  namespace: scalelab
spec:
  type: ClusterIP
  selector:
    app: lab-controller
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-controller
  namespace: scalelab
spec:
  replicas: 1
  # Keep one control-plane writer even during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lab-controller
  template:
    metadata:
      labels:
        app: lab-controller
    spec:
      serviceAccountName: lab-controller
      containers:
        - name: lab-controller
          image: verma17/scalelab-lab-controller:visitor-v1-20261029-4b7d92c1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: lab-controller-config
          env:
            - name: LOADGEN_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lab-controller-control
                  key: loadgen-control-token
            - name: BENCHMARK_RESET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: benchmark-reset
                  key: token
          readinessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
