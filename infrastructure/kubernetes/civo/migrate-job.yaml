apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrate
  namespace: scalelab
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: verma17/scalelab-api:civo-v1
          command:
            - node
            - dist/db/migrate.js
          envFrom:
            - secretRef:
                name: postgres
