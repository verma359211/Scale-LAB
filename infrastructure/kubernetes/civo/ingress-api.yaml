apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scalelab-api
  namespace: scalelab
  annotations:
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - scalelab.chandanverma.space
      secretName: scalelab-tls

  rules:
    - host: scalelab.chandanverma.space
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: scalelab-api
                port:
                  number: 3001

          - path: /health
            pathType: Exact
            backend:
              service:
                name: scalelab-api
                port:
                  number: 3001

          - path: /lab-api
            pathType: Prefix
            backend:
              service:
                name: lab-controller
                port:
                  number: 4000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: scalelab-web
                port:
                  number: 80