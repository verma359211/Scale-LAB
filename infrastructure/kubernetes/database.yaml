apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: scalelab
type: Opaque
stringData:
  POSTGRES_DB: scalelab
  POSTGRES_USER: scalelab
  POSTGRES_PASSWORD: scalelab
  DATABASE_URL: postgresql://scalelab:scalelab@postgres:5432/scalelab
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: scalelab
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: scalelab
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "scalelab", "-d", "scalelab"]
            periodSeconds: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
