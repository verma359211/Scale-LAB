worker_processes auto;

events {
  worker_connections 4096;
}

http {
  resolver 127.0.0.11 ipv6=off valid=30s;

  upstream scalelab_api {
    zone scalelab_api 64k;
    least_conn;

    server api-1:3000 resolve max_fails=5 fail_timeout=2s;
    server api-2:3000 resolve max_fails=5 fail_timeout=2s;
    server api-3:3000 resolve max_fails=5 fail_timeout=2s;

    keepalive 32;
    keepalive_timeout 60s;
  }

  # The Prometheus exporter reads this internal endpoint.
  server {
    listen 8080;
    server_name _;
    access_log off;

    location = /stub_status {
      stub_status;
    }
  }

  server {
    listen 80;
    server_name _;
    server_tokens off;

    # Successful access logs distort local high-throughput benchmarks.
    access_log off;
    error_log /dev/stderr warn;

    location = /nginx-health {
      default_type application/json;
      return 200 '{"status":"ok","service":"nginx"}';
    }

    location / {
      proxy_pass http://scalelab_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Nginx is the only public proxy, so overwrite caller-supplied forwarding
      # chains with the address Nginx actually accepted.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 2s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 3s;
    }
  }
}
