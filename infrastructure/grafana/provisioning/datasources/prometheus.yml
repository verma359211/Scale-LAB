apiVersion: 1
prune: true

datasources:
  - name: ScaleLab Prometheus
    uid: scalelab-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Match Prometheus so Grafana does not downsample short ranges to its
      # default 15-second datasource interval.
      timeInterval: 3s
