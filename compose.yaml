services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scalelab
      POSTGRES_USER: scalelab
      POSTGRES_PASSWORD: scalelab
    ports:
      - "5433:5432"
    volumes:
      - scalelab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalelab -d scalelab"]
      interval: 2s
      timeout: 3s
      retries: 15

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - scalelab_prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3002:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - scalelab_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  k6:
    image: grafana/k6:1.8.1
    profiles: ["tools"]
    environment:
      BASE_URL: http://host.docker.internal:3001
    volumes:
      - ./load-tests:/scripts:ro
      - ./docs/experiments/results:/results
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  scalelab_postgres_data:
  scalelab_prometheus_data:
  scalelab_grafana_data:
