x-api-environment: &api-environment
  NODE_ENV: production
  PORT: "3000"
  CLIENT_ORIGIN: http://localhost:5174
  DATABASE_URL: postgresql://scalelab:scalelab@postgres:5432/scalelab
  DATABASE_POOL_MAX: "20"
  REDIS_URL: redis://redis:6379
  PRODUCT_CACHE_TTL_SECONDS: "30"
  RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
  API_RATE_LIMIT_WINDOW_MS: "${API_RATE_LIMIT_WINDOW_MS:-1000}"
  API_RATE_LIMIT_MAX_REQUESTS: "${API_RATE_LIMIT_MAX_REQUESTS:-500}"
  ORDER_RATE_LIMIT_WINDOW_MS: "${ORDER_RATE_LIMIT_WINDOW_MS:-10000}"
  ORDER_RATE_LIMIT_MAX_REQUESTS: "${ORDER_RATE_LIMIT_MAX_REQUESTS:-5}"
  RATE_LIMIT_FAIL_OPEN: "${RATE_LIMIT_FAIL_OPEN:-true}"
  INSTANCE_ID: api
  SERVER_KEEP_ALIVE_TIMEOUT_MS: "65000"
  SERVER_HEADERS_TIMEOUT_MS: "70000"

x-api-service: &api-service
  image: scalelab-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment:
    <<: *api-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
    interval: 3s
    timeout: 2s
    retries: 20
    start_period: 5s
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scalelab
      POSTGRES_USER: scalelab
      POSTGRES_PASSWORD: scalelab
    ports:
      - "5433:5432"
    volumes:
      - scalelab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalelab -d scalelab"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  api-1:
    <<: *api-service
    environment:
      <<: *api-environment
      INSTANCE_ID: api-1

  api-2:
    <<: *api-service
    environment:
      <<: *api-environment
      INSTANCE_ID: api-2

  api-3:
    <<: *api-service
    environment:
      <<: *api-environment
      INSTANCE_ID: api-3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3001:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      api-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  web:
    image: scalelab-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api
    ports:
      - "5174:80"
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - scalelab_prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3002:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - scalelab_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    command:
      - "--nginx.scrape-uri=http://nginx:8080/stub_status"
      - "--log.level=warn"
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

  k6:
    image: grafana/k6:1.8.1
    profiles: ["tools"]
    environment:
      BASE_URL: http://nginx:80
    depends_on:
      nginx:
        condition: service_healthy
    volumes:
      - ./load-tests:/scripts:ro
      - ./docs/experiments/results:/results

volumes:
  scalelab_postgres_data:
  scalelab_prometheus_data:
  scalelab_grafana_data:
